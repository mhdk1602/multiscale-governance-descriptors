[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "governance-descriptors"
version = "0.1.0"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "gudhi>=3.9",
    "scikit-learn>=1.3",
]
authors = [
    { name = "Dineshkumar Malempati Hari", email = "mhdk.dinesh@gmail.com" },
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
governance-change-risk = "governance_descriptors.change_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
