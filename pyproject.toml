[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "governance-descriptors"
version = "0.1.0"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Dineshkumar Malempati Hari", email = "mhdk.dinesh@gmail.com" },
]

[project.scripts]
governance-change-risk = "governance_descriptors.change_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
